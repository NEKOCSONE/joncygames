<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Colección de Juegos Flash</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background-color: #1a1a1a; color: #fff; margin: 0; padding: 20px; }
        h1 { color: #ffcc00; text-shadow: 2px 2px 4px #000; }
        .selector { margin: 20px auto; padding: 10px; font-size: 16px; background: #333; color: #fff; border: 2px solid #ffcc00; border-radius: 5px; cursor: pointer; }
        .contenedor-juego { margin: 20px auto; width: 800px; height: 600px; background: #000; border: 4px solid #333; border-radius: 8px; box-shadow: 0px 0px 20px rgba(0,0,0,0.7); max-width: 100%; }
        p { color: #aaa; }
    </style>
    <!-- Cargamos Ruffle automáticamente desde un servidor seguro -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <h1>🎮 Mi Portal de Juegos Flash 🎮</h1>
    <p>Selecciona un juego de la lista para empezar a jugar al instante:</p>

    <!-- MENÚ PARA CAMBIAR DE JUEGO -->
    <select id="menuJuegos" class="selector" onchange="cambiarJuego()">
        <!-- Reemplaza los valores de abajo con los nombres exactos de tus archivos .swf -->
        <option value="my_new_room_2.swf">Selecciona un juego...</option>
        <option value="my_new_room_2.swf">Primer Juego (Cambia este nombre)</option>
        <option value="Road_of_the_dead_DesbloqueoPorEmanuel.swf">Segundo Juego (Cambia este nombre)</option>
        <option value="SilentWhisper.swf">Tercer Juego (Cambia este nombre)</option>
    </select>

    <!-- CONTENEDOR DONDE SE EJECUTA RUFFLE -->
    <div class="contenedor-juego">
        <embed id="pantallaFlash" src="" width="100%" height="100%">
    </div>

    <script>
        function cambiarJuego() {
            var lista = document.getElementById("menuJuegos");
            var juegoSeleccionado = lista.options[lista.selectedIndex].value;
            var embed = document.getElementById("pantallaFlash");
            
            // Recargamos el embed con el nuevo juego seleccionado
            embed.src = juegoSeleccionado;
        }
    </script>

</body>
</html>
