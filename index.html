<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Colección de Juegos Flash</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background-color: #1a1a1a; color: #fff; margin: 0; padding: 20px; }
        h1 { color: #ffcc00; text-shadow: 2px 2px 4px #000; }
        .selector { margin: 20px auto; padding: 10px; font-size: 16px; background: #333; color: #fff; border: 2px solid #ffcc00; border-radius: 5px; cursor: pointer; }
        .contenedor-juego { margin: 20px auto; width: 800px; height: 600px; background: #000; border: 4px solid #333; border-radius: 8px; box-shadow: 0px 0px 20px rgba(0,0,0,0.7); max-width: 100%; }
        p { color: #aaa; }
        #player { width: 100%; height: 100%; }
    </style>
    <!-- USAMOS TU ARCHIVO LOCAL: Cargamos el ruffle.js que tienes subido en tu carpeta -->
    <script src="ruffle.js"></script>
</head>
<body>

    <h1>🎮 Joncy Games 🎮</h1>
    <p>Selecciona un juego de la lista para empezar a jugar al instante:</p>

    <!-- MENÚ CON LOS NOMBRES CORREGIDOS -->
    <select id="menuJuegos" class="selector" onchange="cambiarJuego()">
        <option value="">Selecciona un juego de la lista...</option>
        <option value="mynewroom.swf">My New Room 2</option>
        <option value="roadofdead.swf">Road of the Dead</option>
        <option value="silentwhisper.swf">SilentWhisper</option>
    </select>

    <div class="contenedor-juego">
        <div id="player"></div>
    </div>

    <script>
        // Inicialización usando tu Ruffle local
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("player");
        container.appendChild(player);

        player.style.width = "100%";
        player.style.height = "100%";

        function cambiarJuego() {
            var lista = document.getElementById("menuJuegos");
            var juegoSeleccionado = lista.options[lista.selectedIndex].value;
            
            if (juegoSeleccionado !== "") {
                player.load({
                    url: juegoSeleccionado,
                    allowScriptAccess: true,
                    autoplay: "on"
                });
            }
        }
    </script>

</body>
</html>
